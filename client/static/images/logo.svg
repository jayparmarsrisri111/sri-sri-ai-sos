<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Outer Glow / Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="35%" stop-color="#EF4444" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- AI Circuit / Pulse Gradient -->
    <linearGradient id="aiPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.9  0 0.1 0 0 0.1  0 0 0.2 0 0.2  0 0 0 0.8 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Defensive Shield -->
  <path d="M 256, 32 
           C 380, 50 440, 80 440, 200 
           C 440, 340 330, 425 256, 475 
           C 182, 425 72, 340 72, 200 
           C 72, 80 132, 50 256, 32 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glowFilter)" />

  <!-- Inner Concentric Circuit Halo -->
  <path d="M 256, 58 
           C 360, 74 416, 98 416, 200 
           C 416, 320 318, 396 256, 442 
           C 194, 396 96, 320 96, 200 
           C 96, 98 152, 74 256, 58 Z" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-opacity="0.25"
        stroke-width="3" 
        stroke-dasharray="10, 6" />

  <!-- Sacred Crown / Rays at Top (Sri Sri Symbol of Grace & Light) -->
  <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="70" x2="256" y2="92" />
    <line x1="226" y1="76" x2="234" y2="96" />
    <line x1="286" y1="76" x2="278" y2="96" />
    <line x1="200" y1="88" x2="212" y2="105" />
    <line x1="312" y1="88" x2="300" y2="105" />
  </g>

  <!-- Sri Sri Label / Monogram Ribbon -->
  <text x="256" y="145" 
        font-family="'Outfit', sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#F59E0B" 
        text-anchor="middle">
    SRI SRI
  </text>

  <!-- Glowing Heart (Care, Love & Life) -->
  <path d="M 256, 360 
           C 246, 350 150, 280 150, 215 
           C 150, 175 182, 160 216, 160 
           C 238, 160 250, 172 256, 182 
           C 262, 172 274, 160 296, 160 
           C 330, 160 362, 175 362, 215 
           C 362, 280 266, 350 256, 360 Z" 
        fill="url(#heartGrad)" 
        filter="url(#heartGlow)" />

  <!-- AI Lifeline & Neural Pulse (ECG Cardiogram) -->
  <polyline points="
      120,240 
      180,240 
      198,205 
      216,275 
      236,190 
      256,290 
      276,210 
      294,260 
      314,225 
      332,240 
      392,240
    " 
    fill="none" 
    stroke="url(#aiPulseGrad)" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glowFilter)" />

  <!-- Neural Nodes (AI Circles) -->
  <circle cx="120" cy="240" r="6" fill="#38BDF8" />
  <circle cx="198" cy="205" r="5" fill="#FFFFFF" />
  <circle cx="256" cy="290" r="7" fill="#F59E0B" />
  <circle cx="314" cy="225" r="5" fill="#FFFFFF" />
  <circle cx="392" cy="240" r="6" fill="#38BDF8" />

  <!-- Text: SOS AI -->
  <text x="256" y="415" 
        font-family="'Outfit', sans-serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#FFFFFF" 
        text-anchor="middle">
    SOS <tspan fill="#38BDF8">AI</tspan>
  </text>
</svg>
